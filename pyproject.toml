[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subnetry"
version = "1.0.0"
description = "Local network analysis & diagnostic toolkit: speed test, network scanner, Wi-Fi scanner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "psutil>=5.9", "dnspython>=2.4",
    "pyobjc-framework-CoreWLAN>=10; sys_platform == 'darwin' and python_version >= '3.10'",
    "pyobjc-framework-CoreLocation>=10; sys_platform == 'darwin' and python_version >= '3.10'",
    "pywebview>=5.0; (sys_platform == 'darwin' or sys_platform == 'win32') and python_version >= '3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
subnetry = "subnetry.__main__:main"

[tool.setuptools.packages.find]
include = ["subnetry*"]

[tool.setuptools.package-data]
subnetry = ["static/*", "static/brand/*", "macos_helper/*", "desktop/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
